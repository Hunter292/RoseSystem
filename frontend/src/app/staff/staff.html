<div class="w-full sm:w-lg md:w-xl lg:w-3xl xl:w-5xl bg-white text-center py-12 px-2 sm:p-12 shadow-sm mx-auto text-lg">
    <h1 class="title-header">Różowa Księgowa</h1>
    <main>
        <section>
        <h3 class="text-2xl text-center mb-3">Tabela pracowników</h3>
            <div class="flex justify-center items-center mb-3">
                <p class="mr-2 w-20">Miesiąc: </p>
                <select id="month_filter"  class="bg-gray-100 p-3 text-base w-36 focus:outline-primary-300 focus:outline-2">
                    <option value=""></option>
                    <option value="1">Styczeń</option>
                    <option value="2">Luty</option>
                    <option value="3">Marzec</option>
                    <option value="4">Kwiecień</option>
                    <option value="5">Maj</option>
                    <option value="6">Czerwiec</option>
                    <option value="7">Lipiec</option>
                    <option value="8">Sierpień</option>
                    <option value="9">Wrzesień</option>
                    <option value="10">Październik</option>
                    <option value="11">Listopad</option>
                    <option value="12">Grudzień</option>
                </select>
            </div>
            <div class="flex justify-center items-center mb-3">
                <p class="mr-2 w-20"></p>
                <select id="month_filter-2"  class="bg-gray-100 p-3 text-base w-36 focus:outline-primary-300 focus:outline-2">
                    <option value=""></option>
                    <option value="1">Styczeń</option>
                    <option value="2">Luty</option>
                    <option value="3">Marzec</option>
                    <option value="4">Kwiecień</option>
                    <option value="5">Maj</option>
                    <option value="6">Czerwiec</option>
                    <option value="7">Lipiec</option>
                    <option value="8">Sierpień</option>
                    <option value="9">Wrzesień</option>
                    <option value="10">Październik</option>
                    <option value="11">Listopad</option>
                    <option value="12">Grudzień</option>
                </select>
            </div>
            <div class="flex justify-center items-center mb-3 first-">
                <p class="mr-2 w-20">Rok: </p>
                <input type="number" id="year_filter"  class="bg-gray-100 p-3 text-base w-36 focus:outline-primary-300 focus:outline-2">
            </div>
            <button  [disabled]="loading" (click)="get_staff()" class="py-3 px-10 my-5 hover:bg-primary-700 hover:cursor-pointer hover:text-amber-300 transition-colors duration-500 bg-primary-500 rounded-full">Generuj</button>
            <div id="table">

            </div>
            @for(worker of workers;track $index){
                <div class="mb-4 border-2 border-primary-600 rounded-xl hover:cursor-pointer hover:[&>*:first-child]:bg-amber-700 hover:[&>*:first-child]:text-white" (click)="to_worker(worker.id)">
                    <div class=" text-2xl bg-amber-500 font-bold p-2 rounded-xl duration-500 transition-colors"><p>{{worker.head}} h</p></div>
                    <div class="md:grid md:grid-cols-2 gap-y-2 divide-y-2 divide-solid divide-primary-300 p-2 text-xl text-right">
                        @for(job of job_list; track $index){
                            <p>{{job}}: {{worker.body[$index]}} h</p>
                        }
                    </div>
                </div>
            }
        </section>
    </main>
</div>
