server {
    listen 80;
    server_name _;

    # Adjust if your PHP entrypoint lives in a "public/" folder (common
    # for e.g. Slim/Laravel-style structures). Point this at whatever
    # directory contains your front controller (index.php).
    root /var/www/html/api;
    index index.php index.html;

    client_max_body_size 20m;

    # Never serve dotfiles (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }
}
