<div class=" w-4/5 sm:w-lg md:w-xl  text-center mx-auto mt-20">
    <h1 class="text-5xl text-center mt-3 mb-10">Różowa Księgowa</h1>
    <main>
        <div class="mb-2 flex justify-center">
            <div (click)="to_timer()"  class="w-1/2 h-24 bg-emerald-500 px-0 sm:px-2 rounded-2xl mr-2 content-center text-xl sm:text-2xl hover:bg-emerald-600 hover:text-amber-300 transition-colors duration-500 cursor-pointer">
                <span>Wykonane zadania</span>
            </div>
            <div (click)="to_mailer()"  class="w-1/2 h-24 bg-emerald-500 px-0 sm:px-2 rounded-2xl content-center text-xl sm:text-2xl hover:bg-emerald-600 hover:text-amber-300 transition-colors duration-500 cursor-pointer">
                <span>Wysyłanie wyliczeń</span>
            </div>
        </div>
        @if(!is_admin){
            <div (click)="to_profile()"  class=" bg-primary-500 rounded-2xl mb-2 h-24 content-center text-xl sm:text-2xl hover:bg-primary-700 hover:text-amber-300 transition-colors duration-500 cursor-pointer">
                <span>Profil</span>
            </div>
            <div (click)="to_task()"  class=" bg-emerald-500 rounded-2xl mb-2 h-24 content-center text-xl sm:text-2xl hover:bg-emerald-600 hover:text-amber-300 transition-colors duration-500 cursor-pointer">
                <span>Przypisane Zadania</span>
            </div>
        }
        @if(is_admin){
            <div (click)="to_stats()"  class=" bg-primary-500 rounded-2xl mb-2 h-24 content-center text-xl sm:text-2xl hover:bg-primary-700 hover:text-amber-300 transition-colors duration-500 cursor-pointer">
                <span>Opłacalność klientów</span>
            </div>
            <div (click)="to_task()"  class=" bg-emerald-500 rounded-2xl mb-2 h-24 content-center text-xl sm:text-2xl hover:bg-emerald-600 hover:text-amber-300 transition-colors duration-500 cursor-pointer">
                <span>Przypisane Zadania</span>
            </div>
            <div (click)="to_income()"  class=" bg-primary-500 rounded-2xl mb-2 h-24 content-center text-xl sm:text-2xl hover:bg-primary-700 hover:text-amber-300 transition-colors duration-500 cursor-pointer">
                <span>Wpływy z faktur</span>
            </div>

            <div class="mb-2 flex justify-center">
                <div (click)="to_workers()"  class="w-1/2 h-24 bg-emerald-500 px-0 sm:px-2 rounded-2xl mr-2 content-center text-xl sm:text-2xl hover:bg-emerald-600 hover:text-amber-300 transition-colors duration-500 cursor-pointer">
                    <span>Statystyki pracy</span>
                </div>
                <div (click)="to_hr()"  class="w-1/2 h-24 bg-emerald-500 px-0 sm:px-2 rounded-2xl content-center text-xl sm:text-2xl hover:bg-emerald-600 hover:text-amber-300 transition-colors duration-500 cursor-pointer">
                    <span>Zarządzanie pracownikami</span>
                </div>
            </div>
        }
        <div (click)="log_out()"  class="bg-primary-500 rounded-2xl h-24 mb-2 content-center text-xl sm:text-2xl hover:bg-primary-700 hover:text-amber-300 transition-colors duration-500 cursor-pointer">
            <span>Wyloguj</span>
        </div>
    </main>
</div>
