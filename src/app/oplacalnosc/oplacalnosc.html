<div class="w-full sm:w-lg md:w-xl lg:w-3xl xl:w-5xl bg-white text-center py-12 px-2 sm:p-12 shadow-sm mx-auto text-lg">
    <h1 class="text-5xl text-center mb-5">Różowa Księgowa</h1>
    <main>
        <section>
        <h3 class="text-2xl text-center mb-3">Tabela opłacalności</h3>
            <div class="flex justify-center items-center mb-3">
                <p class="mr-2 w-20">Miesiąc: </p>
                <select id="month_filter"  class="bg-gray-100 p-3 text-base w-36 focus:outline-primary-300 focus:outline-2">
                    <option value=""></option>
                    <option value="1">Styczeń</option>
                    <option value="2">Luty</option>
                    <option value="3">Marzec</option>
                    <option value="4">Kwiecień</option>
                    <option value="5">Maj</option>
                    <option value="6">Czerwiec</option>
                    <option value="7">Lipiec</option>
                    <option value="8">Sierpień</option>
                    <option value="9">Wrzesień</option>
                    <option value="10">Październik</option>
                    <option value="11">Listopad</option>
                    <option value="12">Grudzień</option>
                </select>
            </div>
            <div class="flex justify-center items-center mb-3">
                <p class="mr-2 w-20">Rok: </p>
                <input type="number" id="year_filter"  class="bg-gray-100 p-3 text-base w-36 focus:outline-primary-300 focus:outline-2">
            </div>
            <button  [disabled]="loading" (click)="get_rates()" class="py-3 px-10 my-5 hover:bg-primary-700 hover:cursor-pointer hover:text-amber-300 transition-colors duration-500 bg-primary-500 rounded-full">Generuj</button>

            @for(rate of rates; track $index){
                <div (click)="get_work_done(rate.client_nip)" class="  mb-2 border-l-2 border-t-2 border-r-2 border-primary-600
                ">
                <div class="flex justify-center items-start text-left border-b-2 bg-primary-200 border-primary-600 hover:cursor-pointer hover:bg-primary-500 hover:text-amber-300 transition-colors duration-500">
                    <p class="w-4/5">{{rate.name}} <br> NIP: {{rate.client_nip}}</p>
                    <p>{{(rate.rate).toFixed(2)}} zł/h</p>
                </div>
                @if(selected==rate.client_nip){
                    <div id="roll_down{{rate.client_nip}}" class="md:grid md:grid-cols-2 *:p-1 bg-primary-50 border-b-2 border-primary-600">
                    </div>
                }
                </div>
            }
        </section>
    </main>
</div>
