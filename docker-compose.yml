name: rosesystem

services:
  # --------------------------------------------------------------------
  # Frontend: Angular built to static files, served by nginx.
  # --------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-/api}
    image: rosesystem-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend-web
    networks:
      - appnet

  # --------------------------------------------------------------------
  # Backend PHP-FPM process. No ports exposed publicly; only reachable
  # from backend-web (nginx) over the internal network on port 9000.
  # --------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rosesystem-backend:latest
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SECRET_KEY:  ${SECRET_KEY}
      PEPPER:      ${PEPPER}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - appnet

  # --------------------------------------------------------------------
  # Nginx in front of PHP-FPM (fastcgi). Kept as a separate container
  # from `backend` so static assets / fastcgi tuning stay independent
  # of the PHP runtime image.
  # --------------------------------------------------------------------
  backend-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - appnet

  # --------------------------------------------------------------------
  # MySQL database
  # --------------------------------------------------------------------
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - appnet

  # --------------------------------------------------------------------
  # Adminer
  # --------------------------------------------------------------------
  adminer:
    image: adminer:4-standalone
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db
    networks:
      - appnet

  # --------------------------------------------------------------------
  # Automated + on-demand MySQL backups (mysqldump, gzip, retention).
  # Runs on a daily cron by default; can also be invoked manually:
  #   docker compose exec db-backup /usr/local/bin/backup.sh
  # --------------------------------------------------------------------
  db-backup:
    build:
      context: ./docker/mysql-backup
    image: rosesystem-db-backup:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  db_data:
  backend_storage:
